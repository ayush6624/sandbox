openapi: 3.1.0
info:
  title: Sandbox API
  version: 1.4.0
  description: |
    Versioned public contract for creating and operating isolated development
    sandboxes. Routes outside `/v1` are deprecated compatibility endpoints.
servers:
  - url: https://sandbox.example.com
security:
  - bearerAuth: []
tags:
  - {name: Sandboxes}
  - {name: Snapshots}
  - {name: Templates}
  - {name: Operations}
  - {name: Port forwards}
  - {name: Usage}
paths:
  /v1/sandboxes:
    get:
      tags: [Sandboxes]
      operationId: listSandboxes
      parameters:
        - {$ref: '#/components/parameters/PageSize'}
        - {$ref: '#/components/parameters/PageToken'}
        - {name: status, in: query, schema: {type: string, enum: [running, paused]}}
        - {name: source_type, in: query, schema: {type: string, enum: [default, template, snapshot]}}
        - {name: created_after, in: query, schema: {type: string, format: date-time}}
        - {name: created_before, in: query, schema: {type: string, format: date-time}}
      responses:
        '200':
          description: A page of sandboxes.
          content: {application/json: {schema: {$ref: '#/components/schemas/SandboxList'}}}
        default: {$ref: '#/components/responses/Problem'}
    post:
      tags: [Sandboxes]
      operationId: createSandbox
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/CreateSandboxRequest'}}}
      responses:
        '201':
          description: Sandbox created and ready.
          content: {application/json: {schema: {$ref: '#/components/schemas/Sandbox'}}}
        default: {$ref: '#/components/responses/Problem'}
  /v1/sandboxes/{sandbox_id}:
    parameters: [{$ref: '#/components/parameters/SandboxId'}]
    get:
      tags: [Sandboxes]
      operationId: getSandbox
      responses:
        '200': {description: Sandbox, content: {application/json: {schema: {$ref: '#/components/schemas/Sandbox'}}}}
        default: {$ref: '#/components/responses/Problem'}
    patch:
      tags: [Sandboxes]
      operationId: updateSandbox
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content: {application/merge-patch+json: {schema: {$ref: '#/components/schemas/UpdateSandboxRequest'}}}
      responses:
        '200': {description: Updated sandbox, content: {application/json: {schema: {$ref: '#/components/schemas/Sandbox'}}}}
        default: {$ref: '#/components/responses/Problem'}
    delete:
      tags: [Sandboxes]
      operationId: deleteSandbox
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      responses:
        '204': {description: Sandbox permanently deleted.}
        default: {$ref: '#/components/responses/Problem'}
  /v1/sandboxes/{sandbox_id}:pause:
    post:
      tags: [Sandboxes]
      operationId: pauseSandbox
      parameters:
        - {$ref: '#/components/parameters/SandboxId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '200': {description: Paused sandbox, content: {application/json: {schema: {$ref: '#/components/schemas/Sandbox'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /v1/sandboxes/{sandbox_id}:resume:
    post:
      tags: [Sandboxes]
      operationId: resumeSandbox
      parameters:
        - {$ref: '#/components/parameters/SandboxId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '200': {description: Running sandbox, content: {application/json: {schema: {$ref: '#/components/schemas/Sandbox'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /v1/sandboxes/{sandbox_id}/snapshots:
    post:
      tags: [Snapshots]
      operationId: createSnapshot
      parameters:
        - {$ref: '#/components/parameters/SandboxId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        content: {application/json: {schema: {type: object, properties: {name: {type: string}, retention_seconds: {type: integer, minimum: 0}}}}}
      responses:
        '201': {description: Immutable snapshot, content: {application/json: {schema: {$ref: '#/components/schemas/Snapshot'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /v1/sandboxes/{sandbox_id}/port-forwards:
    get:
      tags: [Port forwards]
      operationId: listPortForwards
      parameters:
        - {$ref: '#/components/parameters/SandboxId'}
      responses:
        '200': {description: Active port forwards, content: {application/json: {schema: {$ref: '#/components/schemas/PortForwardList'}}}}
        default: {$ref: '#/components/responses/Problem'}
    post:
      tags: [Port forwards]
      operationId: createPortForward
      parameters:
        - {$ref: '#/components/parameters/SandboxId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [guest_port]
              properties:
                guest_port: {type: integer, minimum: 1, maximum: 65535}
                mode:
                  type: string
                  enum: [raw]
                  description: |
                    Set to `raw` for a durable fleet-wide public TCP endpoint,
                    suitable for non-HTTP protocols. SSH access is owned by the
                    CLI and does not require callers to allocate a raw endpoint.
                    Mutually exclusive with `host_port`. Omit for HTTP ingress
                    or a worker-local host port.
                host_port:
                  type: boolean
                  description: |
                    Whether to also reserve a worker-local host port. `true`
                    gives `host:port` plus an ingress URL, `false` is URL-only
                    and consumes no host-port slot. Omitted follows the
                    worker's own default. URL-only exposure is rejected with
                    400 on a worker with no ingress domain configured.
              additionalProperties: false
      responses:
        '201': {description: Port forward created, content: {application/json: {schema: {$ref: '#/components/schemas/PortForward'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /v1/sandboxes/{sandbox_id}/ssh-access:
    put:
      tags: [Sandboxes]
      operationId: prepareSandboxSshAccess
      description: |
        CLI support endpoint. Applications should direct users to
        `sandbox ssh <sandbox_id>` instead of calling this endpoint or
        constructing a public SSH address themselves.
      parameters:
        - {$ref: '#/components/parameters/SandboxId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [public_key]
              properties:
                public_key: {type: string, description: One OpenSSH public key line.}
              additionalProperties: false
      responses:
        '204': {description: Key authorized and the authenticated SSH tunnel enabled.}
        default: {$ref: '#/components/responses/Problem'}
  /v1/sandbox-batches:
    post:
      tags: [Sandboxes, Operations]
      operationId: createSandboxBatch
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/CreateSandboxBatchRequest'}}}
      responses:
        '202': {description: Batch operation accepted, content: {application/json: {schema: {$ref: '#/components/schemas/Operation'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /v1/snapshots:
    get:
      tags: [Snapshots]
      operationId: listSnapshots
      parameters:
        - {$ref: '#/components/parameters/PageSize'}
        - {$ref: '#/components/parameters/PageToken'}
      responses:
        '200': {description: Snapshot page, content: {application/json: {schema: {$ref: '#/components/schemas/SnapshotList'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /v1/snapshots/{snapshot_id}:
    get:
      tags: [Snapshots]
      operationId: getSnapshot
      parameters:
        - {name: snapshot_id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: Snapshot, content: {application/json: {schema: {$ref: '#/components/schemas/Snapshot'}}}}
        default: {$ref: '#/components/responses/Problem'}
    delete:
      tags: [Snapshots]
      operationId: deleteSnapshot
      parameters:
        - {name: snapshot_id, in: path, required: true, schema: {type: string}}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '204': {description: Snapshot deleted.}
        default: {$ref: '#/components/responses/Problem'}
  /v1/templates:
    get:
      tags: [Templates]
      operationId: listTemplates
      parameters:
        - {$ref: '#/components/parameters/PageSize'}
        - {$ref: '#/components/parameters/PageToken'}
      responses:
        '200': {description: Template page, content: {application/json: {schema: {$ref: '#/components/schemas/TemplateList'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /v1/templates/{template_id}:
    get:
      tags: [Templates]
      operationId: getTemplate
      parameters:
        - {name: template_id, in: path, required: true, schema: {type: string}}
      responses:
        '200': {description: Template, content: {application/json: {schema: {$ref: '#/components/schemas/Template'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /v1/usage:
    get:
      tags: [Usage]
      operationId: listUsage
      summary: Billable usage across the fleet.
      description: |
        Returns billable intervals and their totals. One interval is the span a
        single VM served a sandbox, so a pause/resume cycle produces two.

        `from`/`to` select by OVERLAP: an interval that started before the
        window and is still running is included, and is reported whole rather
        than clipped. Totals cover everything the window selected, including
        intervals beyond the current page.

        Accepts a `sandbox_id` filter, which — unlike
        `/v1/sandboxes/{id}/usage` — also answers for sandboxes that have been
        deleted, since it queries every host rather than routing by id.

        Coverage is live hosts only: usage from a worker that no longer exists
        survives in the deployment's durability bucket, which is the billing
        record of truth. This endpoint is for dashboards and debugging.
      parameters:
        - {$ref: '#/components/parameters/PageSize'}
        - {$ref: '#/components/parameters/PageToken'}
        - {name: sandbox_id, in: query, schema: {type: string}}
        - {name: from, in: query, schema: {type: string, format: date-time}}
        - {name: to, in: query, schema: {type: string, format: date-time}}
      responses:
        '200':
          description: A page of usage intervals with totals for the whole selection.
          content: {application/json: {schema: {$ref: '#/components/schemas/UsageReport'}}}
        default: {$ref: '#/components/responses/Problem'}
  /v1/sandboxes/{sandbox_id}/usage:
    parameters: [{$ref: '#/components/parameters/SandboxId'}]
    get:
      tags: [Usage]
      operationId: getSandboxUsage
      summary: Billable usage for one sandbox.
      description: |
        Routes to the sandbox's current host, so it answers only while the
        sandbox exists. For a deleted sandbox use
        `GET /v1/usage?sandbox_id=`, which asks every host.
      parameters:
        - {$ref: '#/components/parameters/PageSize'}
        - {$ref: '#/components/parameters/PageToken'}
        - {name: from, in: query, schema: {type: string, format: date-time}}
        - {name: to, in: query, schema: {type: string, format: date-time}}
      responses:
        '200':
          description: A page of this sandbox's usage intervals with totals.
          content: {application/json: {schema: {$ref: '#/components/schemas/UsageReport'}}}
        default: {$ref: '#/components/responses/Problem'}
  /v1/operations:
    get:
      tags: [Operations]
      operationId: listOperations
      parameters:
        - {$ref: '#/components/parameters/PageSize'}
        - {$ref: '#/components/parameters/PageToken'}
      responses:
        '200': {description: Operation page, content: {application/json: {schema: {$ref: '#/components/schemas/OperationList'}}}}
        default: {$ref: '#/components/responses/Problem'}
  /v1/operations/{operation_id}:
    get:
      tags: [Operations]
      operationId: getOperation
      parameters: [{name: operation_id, in: path, required: true, schema: {type: string}}]
      responses:
        '200': {description: Operation, content: {application/json: {schema: {$ref: '#/components/schemas/Operation'}}}}
        default: {$ref: '#/components/responses/Problem'}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer}
  parameters:
    IdempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string, maxLength: 255}}
    SandboxId: {name: sandbox_id, in: path, required: true, schema: {type: string}}
    PageSize: {name: page_size, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
    PageToken: {name: page_token, in: query, schema: {type: string}}
  responses:
    Problem:
      description: RFC 9457 problem details.
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}
  schemas:
    Source:
      oneOf:
        - {type: object, required: [type], properties: {type: {const: default}}, additionalProperties: false}
        - {type: object, required: [type, id], properties: {type: {const: template}, id: {type: string}}, additionalProperties: false}
        - {type: object, required: [type, id], properties: {type: {const: snapshot}, id: {type: string}}, additionalProperties: false}
      discriminator: {propertyName: type}
    Lifecycle:
      type: object
      properties:
        ttl_seconds: {type: integer, minimum: 0}
        idle_timeout_seconds: {type: integer, minimum: 0}
      additionalProperties: false
    Resources:
      type: object
      required: [vcpu, memory_mib]
      properties:
        vcpu: {type: integer, minimum: 1}
        memory_mib: {type: integer, minimum: 128}
      additionalProperties: false
    CreateSandboxRequest:
      type: object
      properties:
        name: {type: string, maxLength: 64}
        source: {$ref: '#/components/schemas/Source'}
        lifecycle: {$ref: '#/components/schemas/Lifecycle'}
        resources: {$ref: '#/components/schemas/Resources'}
        metadata: {type: object, additionalProperties: {type: string}, maxProperties: 64}
      additionalProperties: false
    UpdateSandboxRequest:
      type: object
      properties:
        name: {type: string, maxLength: 64}
        lifecycle: {$ref: '#/components/schemas/Lifecycle'}
        metadata: {type: object, additionalProperties: {type: string}, maxProperties: 64}
      additionalProperties: false
    Sandbox:
      type: object
      required: [id, status, source, lifecycle, resources, metadata, created_at]
      properties:
        id: {type: string}
        name: {type: string}
        status: {type: string, enum: [running, paused, deleting]}
        source: {$ref: '#/components/schemas/Source'}
        lifecycle: {$ref: '#/components/schemas/Lifecycle'}
        resources: {$ref: '#/components/schemas/Resources'}
        metadata: {type: object, additionalProperties: {type: string}}
        created_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
    Snapshot:
      type: object
      required: [id, source_sandbox_id, state, created_at]
      properties:
        id: {type: string}
        name: {type: string}
        source_sandbox_id: {type: string}
        state: {type: string, enum: [local, durable]}
        created_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
    Template:
      type: object
      required: [id, revision, resources]
      properties:
        id: {type: string}
        revision: {type: string}
        resources: {$ref: '#/components/schemas/Resources'}
    PortForward:
      type: object
      description: |
        One explicitly exposed guest port. How it is reachable depends on
        `mode`: `host_port` is a worker-local `host:port`, `url` is a public
        ingress URL only, `both` is a host port that ingress also fronts, and
        `raw` is a fleet-wide public TCP address (`public_port`). `host_port`
        is therefore ABSENT for a URL-only exposure — read `mode` first rather
        than assuming a host port exists. Address types can accumulate: a
        mapping that already has HTTP/host access may also carry
        `public_host` and `public_port`, even when its mode remains `both`.
      required: [id, sandbox_id, guest_port, mode, status]
      properties:
        id: {type: string}
        sandbox_id: {type: string}
        guest_port: {type: integer, minimum: 1, maximum: 65535}
        host_port: {type: integer, minimum: 1, maximum: 65535}
        mode: {type: string, enum: [host_port, url, both, raw]}
        url:
          type: string
          format: uri
          description: Public ingress URL; present only when the worker is configured with an ingress domain.
        public_port: {type: integer, minimum: 1, maximum: 65535}
        public_host:
          type: string
          description: Fleet-wide public hostname; present when a raw TCP address is allocated.
        status: {const: active}
    BatchItem:
      type: object
      required: [index]
      properties:
        index: {type: integer}
        sandbox: {$ref: '#/components/schemas/Sandbox'}
        error: {$ref: '#/components/schemas/Problem'}
    Operation:
      type: object
      required: [id, type, status, requested, succeeded, failed, created_at]
      properties:
        id: {type: string}
        type: {const: sandbox_batch_create}
        status: {type: string, enum: [pending, running, succeeded, partially_succeeded, failed]}
        requested: {type: integer}
        succeeded: {type: integer}
        failed: {type: integer}
        results: {type: array, items: {$ref: '#/components/schemas/BatchItem'}}
        created_at: {type: string, format: date-time}
        completed_at: {type: string, format: date-time}
    UsageInterval:
      type: object
      description: |
        One billable span: the time a single VM served a sandbox. `vcpu_seconds`
        and `memory_mib_seconds` are the BILLED quantities (allocated resources
        × duration). `cpu_seconds` is host CPU actually consumed — recorded for
        transparency, never billed, because CPU is oversubscribed.
      required: [id, sandbox_id, sequence, state, resources, started_at, duration_seconds, vcpu_seconds, memory_mib_seconds, cpu_seconds, metadata]
      properties:
        id: {type: string, description: 'Stable and deterministic: "<host>:<sandbox>:<sequence>".'}
        sandbox_id: {type: string}
        sequence: {type: integer, description: Counts a sandbox's intervals from 1; a resume opens the next.}
        host_id: {type: string}
        state: {type: string, enum: [open, closed]}
        resources: {$ref: '#/components/schemas/Resources'}
        started_at: {type: string, format: date-time}
        ended_at: {type: string, format: date-time, description: Absent while the interval is open.}
        duration_seconds:
          type: number
          description: |
            Billable span. An open interval is measured to its last heartbeat,
            never to "now", so a crashed host cannot bill an outage.
        vcpu_seconds: {type: number}
        memory_mib_seconds: {type: number}
        cpu_seconds: {type: number}
        end_reason: {type: string, enum: [destroy, hibernate, expire, shutdown, vm_exit, crash]}
        metadata: {type: object, additionalProperties: {type: string}, description: The sandbox's labels as of interval open; a later update cannot rewrite billing history.}
    UsageTotals:
      type: object
      required: [intervals, open_intervals, duration_seconds, vcpu_seconds, memory_mib_seconds, cpu_seconds]
      properties:
        intervals: {type: integer}
        open_intervals: {type: integer}
        duration_seconds: {type: number}
        vcpu_seconds: {type: number}
        memory_mib_seconds: {type: number}
        cpu_seconds: {type: number}
    UsageReport:
      type: object
      required: [intervals, totals, window, coverage]
      properties:
        intervals: {type: array, items: {$ref: '#/components/schemas/UsageInterval'}}
        totals:
          allOf: [{$ref: '#/components/schemas/UsageTotals'}]
          description: Covers the whole selection, not just the current page.
        window:
          type: object
          required: [selection]
          properties:
            from: {type: string, format: date-time}
            to: {type: string, format: date-time}
            selection: {const: overlap, description: Intervals overlapping the window are included whole, never clipped.}
        coverage:
          type: object
          required: [scope, truncated]
          properties:
            hosts: {type: array, items: {type: string}}
            scope: {const: live_hosts, description: Usage from hosts that no longer exist lives only in the durability bucket.}
            truncated: {type: boolean, description: A host returned fewer rows than it holds; totals are unaffected.}
        next_page_token: {type: string}
    Problem:
      type: object
      required: [type, title, status, code, request_id]
      properties:
        type: {type: string, format: uri}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        instance: {type: string}
        code: {type: string}
        request_id: {type: string}
        violations:
          type: array
          items:
            type: object
            required: [field, description]
            properties: {field: {type: string}, description: {type: string}}
    SandboxList:
      type: object
      required: [sandboxes]
      properties: {sandboxes: {type: array, items: {$ref: '#/components/schemas/Sandbox'}}, next_page_token: {type: string}}
    SnapshotList:
      type: object
      required: [snapshots]
      properties: {snapshots: {type: array, items: {$ref: '#/components/schemas/Snapshot'}}, next_page_token: {type: string}}
    TemplateList:
      type: object
      required: [templates]
      properties: {templates: {type: array, items: {$ref: '#/components/schemas/Template'}}, next_page_token: {type: string}}
    OperationList:
      type: object
      required: [operations]
      properties: {operations: {type: array, items: {$ref: '#/components/schemas/Operation'}}, next_page_token: {type: string}}
    PortForwardList:
      type: object
      required: [port_forwards]
      properties: {port_forwards: {type: array, items: {$ref: '#/components/schemas/PortForward'}}}
    CreateSandboxBatchRequest:
      type: object
      required: [count, sandbox]
      properties:
        count: {type: integer, minimum: 1, maximum: 100}
        sandbox: {$ref: '#/components/schemas/CreateSandboxRequest'}
        max_parallelism: {type: integer, minimum: 1, maximum: 32}
      additionalProperties: false
